<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchingSupplyWithDemands.com</title>

<style>
body{
font-family:Arial;
margin:0;
background:#f4f6f8;
}

header{
background:#1e3a5f;
color:#fff;
padding:20px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-top:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:#1e3a5f;
color:#fff;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:5px;
}

button:hover{opacity:.9;}

.hidden{display:none;}
.delete-btn{background:#b22222;}
.logout-btn{background:#b22222;}
</style>
</head>

<body>

<header>
<h1>MatchingSupplyWithDemands.com</h1>
</header>

<div class="container">

<!-- REQUEST -->
<section class="card">
<h2>Create Job Request</h2>

<form onsubmit="submitRequest(event)">
<input id="name" placeholder="Client Name" required>
<select id="category"></select>
<input id="budget" type="number" placeholder="Budget">
<textarea id="desc" placeholder="Job description"></textarea>
<button type="submit">Submit</button>
</form>
</section>

<!-- LOGIN -->
<section class="card">
<h2>Login</h2>
<input id="loginName" placeholder="Name">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="card hidden">
<h2>Dashboard</h2>
<p id="welcome"></p>
<button class="logout-btn" onclick="logout()">Logout</button>

<h3>Jobs</h3>
<ul id="jobList"></ul>
</section>

<!-- SIGNUP -->
<section class="card">
<h2>Sign Up</h2>
<input id="signupName" placeholder="Name">
<input id="signupPass" type="password" placeholder="Password">
<select id="signupRole"></select>
<button onclick="signup()">Create Account</button>
</section>

<!-- ADMIN -->
<section id="admin" class="card hidden">
<h2>ADMIN PANEL</h2>

<h3>Create New Trade</h3>
<input id="newTrade" placeholder="New trade">
<button onclick="addTrade()">Add Trade</button>

<h3>Trades</h3>
<ul id="tradeList"></ul>

<h3>Users</h3>
<ul id="userList"></ul>

<h3>All Jobs</h3>
<ul id="adminJobs"></ul>

<h3>Reviews</h3>
<ul id="adminReviews"></ul>

<h3>Payments</h3>
<p id="totalRevenue"></p>
<ul id="adminPayments"></ul>
</section>

<!-- REVIEWS -->
<section class="card">
<h2>Reviews</h2>

<select id="reviewProvider"></select>
<select id="reviewStars">
<option>5</option>
<option>4</option>
<option>3</option>
<option>2</option>
<option>1</option>
</select>

<textarea id="reviewText"></textarea>
<button onclick="submitReview()">Submit Review</button>

<h3>All Reviews</h3>
<ul id="reviewList"></ul>
</section>

</div>

<script>

/* DATA */
let trades = JSON.parse(localStorage.getItem("trades")) || [
"Plumbing","Electrical","HVAC","Cleaning","Mechanic","Carpenter"
];

let users = JSON.parse(localStorage.getItem("users")) || [
{id:1,name:"Admin",password:"admin123",role:"admin"}
];

let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
let payments = JSON.parse(localStorage.getItem("payments")) || [];
let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

let currentUser = null;

/* SAVE */
function save(){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("jobs",JSON.stringify(jobs));
localStorage.setItem("payments",JSON.stringify(payments));
localStorage.setItem("reviews",JSON.stringify(reviews));
localStorage.setItem("trades",JSON.stringify(trades));
}

/* ADMIN CHECK */
function isAdmin(){
return currentUser && currentUser.role==="admin";
}

/* DOM SAFE GET */
const $ = (id)=>document.getElementById(id);

/* LOAD OPTIONS */
function loadOptions(){

["category","signupRole","reviewProvider"].forEach(id=>{
let el=$(id);
if(!el) return;

el.innerHTML="";
trades.forEach(t=>{
let opt=document.createElement("option");
opt.value=t;
opt.textContent=t;
el.appendChild(opt);
});
});

renderTradeList();
}

/* TRADE LIST */
function renderTradeList(){
if(!isAdmin()) return;

tradeList.innerHTML="";

trades.forEach((t,i)=>{
let li=document.createElement("li");
li.innerHTML=`
${t}
<button class="delete-btn" onclick="deleteTrade(${i})">Delete</button>
`;
tradeList.appendChild(li);
});
}

/* DELETE TRADE */
function deleteTrade(i){
if(!isAdmin()) return;
trades.splice(i,1);
save();
loadOptions();
}

/* ADD TRADE */
function addTrade(){
if(!isAdmin()) return;

let t = newTrade.value.trim();
if(!t) return;

if(!trades.includes(t)){
trades.push(t);
save();
loadOptions();
alert("Trade added");
}
newTrade.value="";
}

/* SIGNUP */
function signup(){
users.push({
id:Date.now(),
name:signupName.value,
password:signupPass.value,
role:signupRole.value
});
save();
alert("Account created");
}

/* LOGIN */
function login(){

let user = users.find(u=>
u.name===loginName.value &&
u.password===loginPass.value
);

if(!user){alert("Wrong login");return;}

currentUser=user;

dashboard.classList.remove("hidden");
admin.classList.toggle("hidden", !isAdmin());

welcome.innerText=`Logged in as ${user.name} (${user.role})`;

loadJobs();
loadUsers();
loadAdminJobs();
loadPayments();
loadReviews();
}

/* LOGOUT */
function logout(){
location.reload();
}

/* CREATE JOB */
function submitRequest(e){
e.preventDefault();

let clientName = $("name").value.trim();

jobs.push({
id:Date.now(),
client:clientName,
category:$("category").value,
budget:$("budget").value,
desc:$("desc").value,
status:"Pending",
acceptedBy:null,
paymentStatus:"Unpaid"
});

save();

alert("🔔 New job created by " + clientName);

loadJobs();
loadAdminJobs();
loadOptions();

e.target.reset();
}

/* LOAD JOBS */
function loadJobs(){

if(!currentUser) return;

jobList.innerHTML="";

jobs.forEach(job=>{

let canSee = isAdmin() || job.category===currentUser.role;
if(!canSee) return;

let li=document.createElement("li");

let canAccept =
job.acceptedBy===null &&
job.status==="Pending" &&
currentUser.role===job.category;

li.innerHTML=`
<hr>
<strong>${job.category}</strong><br>
Client: ${job.client || "Unknown"}<br>
${job.desc}<br>
Budget: $${job.budget}<br>
Status: ${job.status}<br>
Provider: ${job.acceptedBy || "None"}<br>
Payment: ${job.paymentStatus}

${canAccept ? `<button onclick="accept(${job.id})">Accept</button>`:""}

${job.acceptedBy===currentUser.name && job.status==="In Progress" ? `<button onclick="complete(${job.id})">Complete</button>`:""}

${job.status==="Completed" && job.paymentStatus==="Unpaid" ? `<button onclick="pay(${job.id})">Pay</button>`:""}
`;

jobList.appendChild(li);
});
}

/* ACCEPT */
function accept(id){
let job = jobs.find(j=>j.id===id);
if(job.acceptedBy) return;

job.acceptedBy=currentUser.name;
job.status="In Progress";

save();
loadJobs();
}

/* COMPLETE */
function complete(id){
let job = jobs.find(j=>j.id===id);
job.status="Completed";

save();
loadJobs();
}

/* PAY */
function pay(id){

let job = jobs.find(j=>j.id===id);

job.paymentStatus="Paid";

payments.push({
id:Date.now(),
jobId:job.id,
amount:job.budget,
client:job.client,
provider:job.acceptedBy
});

save();

alert("Payment complete");
loadPayments();
loadJobs();
}

/* USERS */
function loadUsers(){
if(!isAdmin()) return;

userList.innerHTML="";

users.forEach(u=>{

let li=document.createElement("li");

li.innerHTML=`
${u.name} (${u.role})
${u.role!=="admin"
? `<button class="delete-btn" onclick="deleteUser(${u.id})">Delete</button>`
:""}
`;

userList.appendChild(li);
});
}

function deleteUser(id){
if(!isAdmin()) return;
users=users.filter(u=>u.id!==id);
save();
loadUsers();
}

/* ADMIN JOBS */
function loadAdminJobs(){
if(!isAdmin()) return;

adminJobs.innerHTML="";

jobs.forEach(j=>{

let li=document.createElement("li");

li.innerHTML=`
<strong>${j.category}</strong><br>
Client: ${j.client || "Unknown"}<br>
${j.desc}<br>
Status: ${j.status}<br>
<button class="delete-btn" onclick="deleteJob(${j.id})">Delete</button>
`;

adminJobs.appendChild(li);
});
}

function deleteJob(id){
if(!isAdmin()) return;
jobs=jobs.filter(j=>j.id!==id);
save();
loadJobs();
loadAdminJobs();
}

/* PAYMENTS */
function loadPayments(){
if(!isAdmin()) return;

adminPayments.innerHTML="";

let total=0;

payments.forEach(p=>{
total+=Number(p.amount);

let li=document.createElement("li");

li.innerHTML=`
Job ${p.jobId}<br>
Amount: $${p.amount}<br>
Client: ${p.client}<br>
Provider: ${p.provider}<br>
<hr>
`;

adminPayments.appendChild(li);
});

totalRevenue.innerText="Total Revenue: $"+total.toFixed(2);
}

/* REVIEWS */
function submitReview(){

reviews.push({
provider:reviewProvider.value,
stars:reviewStars.value,
text:reviewText.value
});

save();
loadReviews();
loadAdminReviews();
}

/* LOAD REVIEWS */
function loadReviews(){
reviewList.innerHTML="";

reviews.forEach(r=>{

let li=document.createElement("li");

li.innerHTML=`
${r.provider} - ${r.stars}<br>
${r.text}
`;

reviewList.appendChild(li);
});
}

/* ADMIN REVIEWS */
function loadAdminReviews(){
if(!isAdmin()) return;

adminReviews.innerHTML="";

reviews.forEach((r,i)=>{

let li=document.createElement("li");

li.innerHTML=`
${r.provider} - ${r.stars}
<button class="delete-btn" onclick="deleteReview(${i})">Delete</button>
`;

adminReviews.appendChild(li);
});
}

function deleteReview(i){
if(!isAdmin()) return;
reviews.splice(i,1);
save();
loadReviews();
loadAdminReviews();
}

/* INIT */
loadOptions();

</script>

</body>
</html>
