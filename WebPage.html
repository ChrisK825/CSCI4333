<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchingSupplyWithDemands.com</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
header{background:#1e3a5f;color:#fff;padding:20px;text-align:center}
nav{display:flex;justify-content:center;gap:15px;background:#16304d;padding:10px}
nav a{color:#fff;text-decoration:none;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-top:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:#1e3a5f;color:#fff;padding:10px;border:none;border-radius:8px;cursor:pointer}
.hidden{display:none}
.logout-btn{background:#b22222;margin-top:10px}
</style>

</head>

<body>

<header>
<h1>MatchingSupplyWithDemands.com</h1>
<p>Role-Based Marketplace System</p>
</header>

<nav>
<a href="#request">Request</a>
<a href="#login">Login</a>
<a href="#signup">Sign Up</a>
<a href="#admin">Admin</a>
<a href="#review">Reviews</a>
</nav>

<div class="container">

<!-- REQUEST -->
<section id="request" class="card">
<h2>Create Service Request</h2>
<form onsubmit="submitRequest(event)">
<input id="name" placeholder="Name" required>

<select id="category">
<option>Plumbing</option>
<option>Electrical</option>
<option>HVAC</option>
<option>Cleaning</option>
<option>Mechanic</option>
<option>Carpenter</option>
</select>

<input type="number" id="budget" placeholder="Budget">
<textarea id="desc" placeholder="Describe job"></textarea>

<button type="submit">Submit</button>
<p id="msg"></p>
</form>
</section>

<!-- LOGIN -->
<section id="login" class="card">
<h2>Login</h2>

<input id="loginName" placeholder="Enter your name">
<input type="password" id="loginPass" placeholder="Password = 123">

<button onclick="login()">Login</button>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="card hidden">
<h2>Dashboard</h2>
<p id="welcome"></p>
<button class="logout-btn" onclick="logout()">Logout</button>

<h3>Available Jobs</h3>
<ul id="jobList"></ul>
</section>

<!-- SIGNUP -->
<section id="signup" class="card">
<h2>Sign Up (Create Trade Account)</h2>

<input id="signupName" placeholder="Your Name">

<select id="signupRole">
<option>Plumbing</option>
<option>Electrical</option>
<option>HVAC</option>
<option>Cleaning</option>
<option>Mechanic</option>
<option>Carpenter</option>
</select>

<button onclick="signup()">Create Account</button>
</section>

<!-- ADMIN -->
<section id="admin" class="card">
<h2>ADMIN PANEL</h2>

<h3>Users</h3>
<ul id="userList"></ul>

<h3>Jobs</h3>
<ul id="adminJobs"></ul>

<h3>Reviews</h3>
<ul id="adminReviews"></ul>
</section>

<!-- REVIEWS -->
<section id="review" class="card">
<h2>Reviews</h2>

<select id="reviewTrade">
<option>Plumbing</option>
<option>Electrical</option>
<option>HVAC</option>
<option>Cleaning</option>
<option>Mechanic</option>
<option>Carpenter</option>
</select>

<select id="stars">
<option>5 Stars</option>
<option>4 Stars</option>
<option>3 Stars</option>
</select>

<textarea id="reviewText"></textarea>
<button onclick="submitReview()">Submit Review</button>

<h3>All Reviews</h3>
<ul id="reviewList"></ul>
</section>

</div>

<script>

/* STORAGE */
let serviceRequests = JSON.parse(localStorage.getItem("requests")) || [];
let reviews = JSON.parse(localStorage.getItem("reviews")) || [];
let users = JSON.parse(localStorage.getItem("users")) || [
  {id:1,name:"Admin",role:"admin"}
];

let currentUser = null;

/* ENSURE ADMIN EXISTS */
if(!users.some(u=>u.role==="admin")){
  users.push({id:1,name:"Admin",role:"admin"});
}

/* ADMIN CHECK */
function isAdmin(){
  return currentUser && currentUser.role === "admin";
}

/* SIGNUP */
function signup(){
  let name=document.getElementById("signupName").value;
  let role=document.getElementById("signupRole").value;

  if(!name){alert("Enter name");return;}

  if(users.some(u=>u.name === name)){
    alert("User already exists");
    return;
  }

  users.push({
    id:Date.now(),
    name,
    role
  });

  localStorage.setItem("users",JSON.stringify(users));
  alert("Account created!");
  loadUsers();
}

/* LOGIN */
function login(){
  let name=document.getElementById("loginName").value;
  let pass=document.getElementById("loginPass").value;

  if(pass!=="123"){
    alert("Password is 123");
    return;
  }

  let user = users.find(u=>u.name===name);

  if(!user){
    alert("User not found. Please sign up.");
    return;
  }

  currentUser = user;

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("welcome").innerText =
    "Logged in as " + user.name + " (" + user.role + ")";

  loadJobs(user.role);
}

/* LOGOUT */
function logout(){
  currentUser=null;
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

/* REQUEST */
function submitRequest(e){
e.preventDefault();

serviceRequests.push({
id:Date.now(),
name:document.getElementById("name").value,
category:document.getElementById("category").value,
budget:document.getElementById("budget").value,
desc:document.getElementById("desc").value,
acceptedBy:null
});

localStorage.setItem("requests",JSON.stringify(serviceRequests));

document.getElementById("msg").innerText="Saved!";
e.target.reset();
}

/* JOBS */
function loadJobs(role){
let list=document.getElementById("jobList");
list.innerHTML="";

serviceRequests
.filter(r=>r.category===role)
.forEach(r=>{
let li=document.createElement("li");

li.innerHTML=`
${r.desc} - $${r.budget}
<br>
${r.acceptedBy ? "Accepted by: " + r.acceptedBy : ""}
<br>
<button onclick="acceptJob(${r.id})">Accept</button>
`;

list.appendChild(li);
});
}

/* ACCEPT JOB */
function acceptJob(id){
let job = serviceRequests.find(j=>j.id===id);

if(job.acceptedBy){
alert("Already accepted by " + job.acceptedBy);
return;
}

job.acceptedBy = currentUser.name;

localStorage.setItem("requests",JSON.stringify(serviceRequests));

loadJobs(currentUser.role);
}

/* USERS */
function loadUsers(){
let list=document.getElementById("userList");
list.innerHTML="";

users.forEach(u=>{
let li=document.createElement("li");

li.innerHTML=`
${u.name} (${u.role})
<button onclick="deleteUser(${u.id})">Delete</button>
`;

list.appendChild(li);
});
}

/* DELETE USER */
function deleteUser(id){

if(!isAdmin()){
alert("Only admin can delete users");
return;
}

let user = users.find(u=>u.id===id);

if(user.role==="admin"){
alert("Admin cannot be deleted.");
return;
}

users=users.filter(u=>u.id!==id);
localStorage.setItem("users",JSON.stringify(users));
loadUsers();
}

/* REVIEWS */
function submitReview(){
reviews.push({
trade:document.getElementById("reviewTrade").value,
stars:document.getElementById("stars").value,
text:document.getElementById("reviewText").value
});

localStorage.setItem("reviews",JSON.stringify(reviews));

loadReviews();
loadAdminReviews();
}

function loadReviews(){
let list=document.getElementById("reviewList");
list.innerHTML="";

reviews.forEach(r=>{
let li=document.createElement("li");
li.innerHTML=`${r.trade} - ${r.stars} - ${r.text}`;
list.appendChild(li);
});
}

/* ADMIN REVIEWS */
function loadAdminReviews(){
let list=document.getElementById("adminReviews");
list.innerHTML="";

reviews.forEach((r,i)=>{
let li=document.createElement("li");

li.innerHTML=`
${r.trade} - ${r.stars}
<button onclick="deleteReview(${i})">Delete</button>
`;

list.appendChild(li);
});
}

function deleteReview(i){

if(!isAdmin()){
alert("Only admin can delete reviews");
return;
}

reviews.splice(i,1);
localStorage.setItem("reviews",JSON.stringify(reviews));

loadReviews();
loadAdminReviews();
}

/* INIT */
loadUsers();
loadReviews();
loadAdminReviews();

</script>

</body>
</html>
